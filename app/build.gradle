plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edjay.lifeorganizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edjay.lifeorganizer'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '3.7.5'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Keep the same application ID so test builds update the installed app.
            // When GitHub signing secrets are available, debug is signed with the same release key.
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
