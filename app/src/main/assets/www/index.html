<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f6faf7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Edjay's Life Organizer</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand"><span>Edjay's Life Organizer</span></div>
        <div class="tagline">Plan • Do • Grow • A Better Me Everyday</div>
      </div>
      <button class="icon-btn profile-btn" id="profileBtn" aria-label="Open profile">E</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <button id="fab" class="fab" aria-label="Quick add">＋</button>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-view="today" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7v9.25a.75.75 0 0 1-.75.75h-5.1v-6h-5.3v6h-5.1a.75.75 0 0 1-.75-.75z"/></svg></span><small>Today</small></button>
      <button data-view="tasks" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8 12.2 2.5 2.5 5.7-6"/></svg></span><small>Tasks</small></button>
      <button data-view="plan" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M7.5 3.5v4M16.5 3.5v4M3.5 9.5h17"/></svg></span><small>Plan</small></button>
      <button data-view="life" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.2S4.2 15.5 4.2 9.4A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.8 2.2c0 6.1-7.8 10.8-7.8 10.8Z"/></svg></span><small>Life</small></button>
    </nav>
  </div>

  <div id="sheetBackdrop" class="backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Quick Add</h2>
      <button class="icon-btn" id="closeSheet">✕</button>
    </div>
    <div id="sheetBody"></div>
  </section>

  <div id="fullscreen" class="fullscreen hidden" role="dialog" aria-modal="true">
    <div id="fullscreenBody"></div>
  </div>

  <script src="level-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
